name: propertyflow-fixed

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/propertyflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=debug_challenge_fixed_secret
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8001
    ports:
      - "3001:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=propertyflow
    ports:
      - "5434:5432"
    volumes:
      # Initialize DB with schema and seeds
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
      # Ephemeral storage for easy reset (comment out to persist)
      # - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6381:6379"

volumes:
  pgdata:
